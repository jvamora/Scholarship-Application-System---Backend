# Nginx server block for the Scholarship app on a Hostinger VPS.
#
# Roles:
#   - serves the built React SPA (client/dist) as static files
#   - proxies /api and /uploads to the Node API (localhost:3000)
#
# 1) Copy to:  /etc/nginx/sites-available/scholarship
# 2) Enable + test:
#      sudo ln -s /etc/nginx/sites-available/scholarship /etc/nginx/sites-enabled/scholarship
#      sudo nginx -t && sudo systemctl reload nginx
# 3) After the site is up, add HTTPS with:
#      sudo certbot --nginx -d amora.bscs4a.com
#    (certbot rewrites this file to enable TLS.)

server {
    listen 80;
    server_name amora.bscs4a.com;

    # Built frontend. Point this at your client/dist on disk.
    root /var/www/scholarship/client;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1000;

    # Long-lived assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA routing: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploaded documents/avatars -> Node backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
